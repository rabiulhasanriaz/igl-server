name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          RAW_GITLAB_TOKEN: ${{ secrets.IGL_SMS }}
          RAW_GITLAB_REPOSITORY: ${{ secrets.IGL_SMS_REPO }}
        run: |
          GITLAB_TOKEN="$(printf '%s' "$RAW_GITLAB_TOKEN" | tr -d '\r\n')"
          GITLAB_REPOSITORY="$(printf '%s' "$RAW_GITLAB_REPOSITORY" | tr -d '\r\n')"

          test -n "$GITLAB_TOKEN" || {
            echo "GitLab token is missing"
            exit 1
          }

          test -n "$GITLAB_REPOSITORY" || {
            echo "GitLab repository is missing"
            exit 1
          }

          echo "Repository configured."

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPOSITORY}.git"

          git push gitlab main