name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitLab configuration
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
        run: |
          test -n "$GITLAB_TOKEN" || { echo "GITLAB_TOKEN is missing"; exit 1; }
          test -n "$GITLAB_USERNAME" || { echo "GITLAB_USERNAME is missing"; exit 1; }
          test -n "$GITLAB_REPOSITORY" || { echo "GITLAB_REPOSITORY is missing"; exit 1; }

          echo "GitLab configuration found."
          echo "Repository: $GITLAB_REPOSITORY"

      - name: Sync to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
        run: |
          git remote add gitlab \
            "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPOSITORY}.git"

          git push gitlab main