name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Sync main branch to GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitLab configuration
        env:
          RAW_GITLAB_TOKEN: ${{ secrets.IGL_SMS }}
          RAW_GITLAB_REPOSITORY: ${{ secrets.IGL_SMS_REPO }}
        run: |
          GITLAB_TOKEN="$(printf '%s' "$RAW_GITLAB_TOKEN" | tr -d '\r\n')"
          GITLAB_REPOSITORY="$(printf '%s' "$RAW_GITLAB_REPOSITORY" | tr -d '\r\n')"

          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GitLab token is missing."
            exit 1
          fi

          if [ -z "$GITLAB_REPOSITORY" ]; then
            echo "GitLab repository is missing."
            exit 1
          fi

          echo "GitLab configuration found."
          echo "Repository: $GITLAB_REPOSITORY"

      - name: Push to GitLab
        env:
          RAW_GITLAB_TOKEN: ${{ secrets.IGL_SMS }}
          RAW_GITLAB_REPOSITORY: ${{ secrets.IGL_SMS_REPO }}
        run: |
          GITLAB_TOKEN="$(printf '%s' "$RAW_GITLAB_TOKEN" | tr -d '\r\n')"
          GITLAB_REPOSITORY="$(printf '%s' "$RAW_GITLAB_REPOSITORY" | tr -d '\r\n')"

          git remote remove gitlab 2>/dev/null || true

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPOSITORY}.git"

          git push gitlab main
